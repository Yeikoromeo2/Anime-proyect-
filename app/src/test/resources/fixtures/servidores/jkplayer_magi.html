<script>

var player = videojs("video", {
    controls: true,
    preload: 'auto',
    plugins: {
        filters :{},
        shoot :{},
    }
});


let lastSentTime = 0;

player.on('timeupdate', function() {
    const currentTime = player.currentTime();
    const duration = player.duration();
    const percent = (currentTime / duration) * 100;

    // Enviar solo si hay un cambio significativo (0.5s o 1% de progreso)
    if (Math.abs(currentTime - lastSentTime) >= 0.5 || Math.abs(percent - (lastSentTime / duration) * 100) >= 1) {
        window.parent.postMessage({
            action: 'history_play',
            time: percent,
        }, '*'); // Usa tu dominio en lugar de '*' en producción

        lastSentTime = currentTime;
    }
});
